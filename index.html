<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Orbital Siege">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Orbital Siege</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#screen{position:relative;line-height:0;box-shadow:0 0 40px rgba(90,140,255,.14)}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;outline:none}
#scan{position:absolute;inset:0;pointer-events:none}
#pad{display:none;width:100%;max-width:520px;justify-content:space-between;align-items:center;padding:0 16px 6px;box-sizing:border-box}
#pad .grp{display:flex;gap:14px;touch-action:none;padding:10px;margin:-10px}
.btn{width:74px;height:74px;border-radius:50%;border:2px solid #1f4f8b;background:#070d1a;color:#7ab8ff;font:700 24px ui-monospace,monospace;display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none}
.btn.on{background:#13284a}
#fire{width:92px;height:92px;border-color:#7a2a3c;background:#170a0e;color:#ff6a8a;font-size:17px}
#fire.on{background:#3a1420}
#mute{position:absolute;top:6px;right:6px;background:none;border:1px solid #234;color:#5a8;font:600 11px ui-monospace,monospace;padding:4px 7px;border-radius:4px;opacity:.7;line-height:1}
</style>
</head>
<body>
<div id="wrap">
  <div id="screen">
    <canvas id="c" width="224" height="288" tabindex="0"></canvas>
    <div id="scan"></div>
    <button id="mute" aria-label="Toggle sound">SND ON</button>
  </div>
  <div id="pad">
    <div class="grp" id="dpad"><div class="btn" id="bl">&#9664;</div><div class="btn" id="br">&#9654;</div></div>
    <div class="btn" id="fire">FIRE</div>
  </div>
</div>
<script>
(()=>{
'use strict';
const W=224,H=288,PY=250,PI=Math.PI;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');ctx.imageSmoothingEnabled=false;
let K=1,ALPHA=1; // K: device pixels per arcade pixel; ALPHA: blend between the last two 60 Hz updates
const SNAP=v=>Math.round(v*K)/K;
const rnd=Math.random,clamp=(v,a,b)=>v<a?a:v>b?b:v,pick=a=>a[(rnd()*a.length)|0];

/* ---------- sprites: original designs. '#','o','x' = palette slots 1..3 ---------- */
function P(rows){const h=rows.length,w=rows[0].length,d=new Uint8Array(w*h);
  rows.forEach((r,y)=>{for(let x=0;x<w;x++){const ch=r[x];d[y*w+x]=ch==='#'?1:ch==='o'?2:ch==='x'?3:0;}});return{w,h,d};}
const SP={
 drone:[P(["....###....","...#####...",".o.#x#x#.o.","o.o#####o.o","o..#####..o",".o..###..o.","....#.#....","...#...#..."]),
        P(["....###....","...#####...","...#x#x#...",".ooo###ooo.","o..#####..o","o...###...o","....#.#....","....#.#...."])],
 wasp:[P(["oo.........oo",".oo..###..oo.","..oo.#x#.oo..","...o#####o...","..#########..",".oo.#####.oo.","oo...###...oo","......#......"]),
       P([".............","o....###....o","oo...#x#...oo",".oo.#####.oo.","..#########..","...#.###.#...","....#.#.#....","......#......"])],
 boss:[P(["......###......","....#######....","...##x###x##...","..###########..",".oo#########oo.","oo..#######..oo","o..ooo###ooo..o","o.oo...#...oo.o","..o....#....o..",".......#......."]),
       P(["......###......","o...#######...o","oo.##x###x##.oo",".oo#########oo.","..o#########o..","...o#######o...","....ooo#ooo....",".......#.......",".......#.......",".......#......."])],
 ship:P([".......#.......",".......#.......","......###......","......###......","...o..###..o...","...o.##x##.o...","...#.##x##.#...","o..#########..o","o..##.###.##..o","#.###########.#","#######.#######","##.o###.###o.##","#..o.......o..#"])
};
const PAL={
 drone:['#ffd23c','#4aa8ff','#ff4d4d'],wasp:['#ff4d6d','#f2f2ff','#ffd23c'],
 boss:['#3cf0a0','#2f7bff','#ff6ad5'],boss2:['#b66cff','#ff6ad5','#ffd23c'],
 ship:['#f2f2ff','#ff4d4d','#4aa8ff'],captive:['#ff4d4d','#ffd23c','#ffffff']};
/* stage counter badges (original designs): pennant 1, big pennant 5, shield 10, star 20, diamond 30, crown 50 */
const BADGE={
 1:P(["#....","#oo..","#ooo.","#oo..","#....","#....","#....","#....","#....","#...."]),
 5:P(["#......","#ooo...","#ooxxx.","#ooxxxx","#ooxxx.","#ooo...","#......","#......","#......","#......"]),
 10:P([".#####.","#ooooo#","#oxxxo#","#oxxxo#","#oxxxo#","#ooooo#",".#ooo#.","..#o#..","...#..."]),
 20:P(["....#....","...###...","...#o#...","####o####",".#ooooo#.","..#ooo#..",".#o#.#o#.",".##...##."]),
 30:P(["...#...","..#o#..",".#ooo#.","#ooxoo#","#oxxxo#","#ooxoo#",".#ooo#.","..#o#..","...#..."]),
 50:P(["#...#...#","##.###.##","#########","#ooxoxoo#","#########",".#######."])};
const BPAL={1:['#c8c8d8','#ff4d4d','#ff4d4d'],5:['#c8c8d8','#ffd23c','#ff6a8a'],10:['#7ab8ff','#2f4fa8','#f2f2ff'],
 20:['#ffd23c','#ff9a3c','#ff9a3c'],30:['#3cf0a0','#1a8a5c','#f2f2ff'],50:['#ffd23c','#ff4d4d','#7ab8ff']};
function drawBadges(n){const list=[];for(const v of[50,30,20,10,5,1])while(n>=v){list.push(v);n-=v;}
  let x=W-3;for(let i=list.length-1;i>=0;i--){const sp=BADGE[list[i]];x-=sp.w;ctx.drawImage(img(sp,BPAL[list[i]]),x,H-3-sp.h);x-=2;}}
const TYPES={drone:{hw:5,hh:4,form:50,dive:100},wasp:{hw:6,hh:4,form:80,dive:160},boss:{hw:7,hh:5,form:150,dive:400},turncoat:{hw:6,hh:5,form:500,dive:1000}};
const cache=new Map();
function img(sp,pal){const k=pal.join();let m=cache.get(sp);if(!m){m=new Map();cache.set(sp,m);}let c=m.get(k);
  if(!c){c=document.createElement('canvas');c.width=sp.w;c.height=sp.h;const g=c.getContext('2d');
    for(let y=0;y<sp.h;y++)for(let x=0;x<sp.w;x++){const v=sp.d[y*sp.w+x];if(v){g.fillStyle=pal[v-1];g.fillRect(x,y,1,1);}}m.set(k,c);}return c;}
function drawRot(sp,pal,x,y,ang){let r=ang+PI/2;r=Math.round(r/(PI/8))*(PI/8);
  ctx.save();ctx.translate(SNAP(x),SNAP(y));if(r)ctx.rotate(r);ctx.drawImage(img(sp,pal),-(sp.w>>1),-(sp.h>>1));ctx.restore();}

/* ---------- 5x7 bitmap font ---------- */
const F={'0':[62,81,73,69,62],'1':[0,66,127,64,0],'2':[66,97,81,73,70],'3':[33,65,69,75,49],'4':[24,20,18,127,16],'5':[39,69,69,69,57],'6':[60,74,73,73,48],'7':[1,113,9,5,3],'8':[54,73,73,73,54],'9':[6,73,73,41,30],
A:[126,17,17,17,126],B:[127,73,73,73,54],C:[62,65,65,65,34],D:[127,65,65,34,28],E:[127,73,73,73,65],F:[127,9,9,9,1],G:[62,65,73,73,122],H:[127,8,8,8,127],I:[0,65,127,65,0],J:[32,64,65,63,1],K:[127,8,20,34,65],L:[127,64,64,64,64],M:[127,2,12,2,127],N:[127,4,8,16,127],O:[62,65,65,65,62],P:[127,9,9,9,6],Q:[62,65,81,33,94],R:[127,9,25,41,70],S:[70,73,73,73,49],T:[1,1,127,1,1],U:[63,64,64,64,63],V:[31,32,64,32,31],W:[63,64,56,64,63],X:[99,20,8,20,99],Y:[7,8,112,8,7],Z:[97,81,73,69,67],
'-':[8,8,8,8,8],'=':[20,20,20,20,20],'.':[0,96,96,0,0],'?':[2,1,81,9,6],'!':[0,0,95,0,0],':':[0,54,54,0,0],'/':[32,16,8,4,2],'+':[8,8,62,8,8],'%':[35,19,8,100,98],' ':[0,0,0,0,0]};
const textCache=new Map();
function text(s,x,y,col){s=String(s).toUpperCase();if(!s.length)return;const key=col+'|'+s;let c=textCache.get(key);
  if(!c){if(textCache.size>300)textCache.clear();c=document.createElement('canvas');c.width=s.length*6;c.height=7;const g=c.getContext('2d');g.fillStyle=col;
    for(let i=0;i<s.length;i++){const gl=F[s[i]]||F['?'];for(let cc=0;cc<5;cc++){const b=gl[cc];for(let r=0;r<7;r++)if(b>>r&1)g.fillRect(i*6+cc,r,1,1);}}textCache.set(key,c);}
  ctx.drawImage(c,x,y);}
const ctext=(s,y,col)=>text(s,Math.floor((W-String(s).length*6+1)/2),y,col);
const rtext=(s,xr,y,col)=>text(s,xr-String(s).length*6+1,y,col);

/* ---------- audio (synthesised) ---------- */
let AC=null,master=null,noiseBuf=null,muted=false,beamSnd=null;
function ensureAudio(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;const lo=AC.createBiquadFilter(),hi=AC.createBiquadFilter(),comp=AC.createDynamicsCompressor();
    lo.type='lowshelf';lo.frequency.value=180;lo.gain.value=6;hi.type='highshelf';hi.frequency.value=3200;hi.gain.value=-7;
    comp.threshold.value=-18;comp.ratio.value=4;comp.attack.value=.003;comp.release.value=.2;
    master.connect(lo);lo.connect(hi);hi.connect(comp);comp.connect(AC.destination);
    noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=rnd()*2-1;}catch(e){AC=null;}}
  if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});}
let silentEl=null;
function makeSilent(){ // short silent WAV looped through an <audio> element: puts iOS into "playback" so silent mode doesn't mute the game
  const sr=8000,n=800,buf=new ArrayBuffer(44+n*2),v=new DataView(buf),w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  const a=new Audio(URL.createObjectURL(new Blob([buf],{type:'audio/wav'})));a.loop=true;a.setAttribute('playsinline','');return a;}
function unlockAudio(){
  if(AC&&AC.state==='running'&&silentEl&&!silentEl.paused)return;
  try{if(navigator.audioSession)navigator.audioSession.type='playback';}catch(e){}
  ensureAudio();
  if(AC){try{const b=AC.createBuffer(1,1,22050),s=AC.createBufferSource();s.buffer=b;s.connect(AC.destination);s.start(0);}catch(e){}}
  try{if(!silentEl)silentEl=makeSilent();const pr=silentEl.play();if(pr&&pr.catch)pr.catch(()=>{});}catch(e){}
}
['pointerdown','pointerup','touchstart','touchend','mousedown','click','keydown','keyup'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));
function env(g,t,a,d,v){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+d);}
function tone(f,dur,type,vol,f2,delay=0){if(!AC||muted)return;const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);env(g,t,.004,dur,vol);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);}
function noise(dur,vol,freq){if(!AC||muted)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;
  f.type='lowpass';f.frequency.setValueAtTime(freq,t);f.frequency.exponentialRampToValueAtTime(80,t+dur);env(g,t,.003,dur,vol);s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.05);}
const seq=(notes,step,type,vol)=>notes.forEach((f,i)=>f&&tone(f,step*.9,type,vol,0,i*step));
// sound kit: original synthesis, voiced low and weighty (every effect pairs a body/sub layer with its attack)
const lowSeq=(notes,step,vol)=>notes.forEach((f,i)=>{if(!f)return;tone(f,step*.9,'square',vol*.6,0,i*step);tone(f/2,step*.9,'triangle',vol,0,i*step);});
const VL={};function voice(k,max,dur){const t=AC?AC.currentTime:0,a=(VL[k]=(VL[k]||[]).filter(x=>x>t));if(a.length>=max)return false;a.push(t+dur);return true;}
const sfx={
  shoot(){if(!voice('shot',4,.07))return;tone(620,.07,'square',.05,180);tone(160,.06,'sine',.14,70);noise(.05,.12,1800);},
  boom(){if(!voice('boom',4,.3))return;noise(.32,.45,1800);tone(180,.25,'sine',.32,45);tone(260,.14,'square',.05,60);},
  bossHit(){tone(300,.08,'square',.07,420);tone(140,.1,'sine',.18,90);},
  dive(){if(!voice('dive',3,1.3))return;tone(900,1.3,'triangle',.07,150);tone(450,1.3,'sine',.05,75);}, // long falling whistle, now an octave lower with a sub layer
  die(){ // the big one: hard crack, then ~1.5 s of heavy low rumble decaying away
    if(!AC||muted)return;const t=AC.currentTime;
    noise(.1,.55,3000);
    const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=noiseBuf;s.loop=true;
    f.type='lowpass';f.frequency.setValueAtTime(1100,t);f.frequency.exponentialRampToValueAtTime(200,t+1.6);f.Q.value=.8;
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.85,t+.015);g.gain.setValueAtTime(.85,t+.3);g.gain.exponentialRampToValueAtTime(.0001,t+1.7);
    s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+1.75);
    tone(80,1.2,'sine',.5,28);tone(160,.6,'square',.07,40);},
  small(){noise(.6,.45,1400);tone(120,.5,'sine',.32,35);},
  jingle(){lowSeq([196,262,330,262,294,349,440,0,392,494,587],.09,.06);},
  captured(){lowSeq([440,415,392,370,349,330,311,294,277,262],.12,.07);},
  rescue(){lowSeq([262,330,392,523,392,523,659],.08,.06);},
  perfect(){ // original victory fanfare: rising call, answer, run down, big final chord
    const n=(f,t,d,v=.07)=>{tone(f,d,'square',v*.6,0,t);tone(f/2,d,'triangle',v,0,t);};
    [[392,0,.11],[523,.12,.11],[659,.24,.11],[784,.36,.32],[659,.72,.11],[784,.84,.26],[880,1.14,.11],[784,1.26,.11],[698,1.38,.11],[659,1.5,.11],[587,1.62,.11],[523,1.74,.14]].forEach(([f,t,d])=>n(f,t,d));
    [523,659,784,1046].forEach(f=>n(f,1.92,1.1,.055));tone(131,1.2,'sine',.25,0,1.92);noise(.9,.12,6000);},
  life(){lowSeq([392,494,587,784,587,784],.07,.07);},
  beamOn(){if(!AC||muted||beamSnd)return;const o=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain(),f=AC.createBiquadFilter(),g=AC.createGain();
    o.type='sawtooth';o.frequency.value=165;l.frequency.value=6;lg.gain.value=60;l.connect(lg);lg.connect(o.frequency);
    f.type='lowpass';f.frequency.value=1200;g.gain.value=.06;o.connect(f);f.connect(g);g.connect(master);o.start();l.start();beamSnd={o,l};},
  beamOff(){if(beamSnd){try{beamSnd.o.stop();beamSnd.l.stop();}catch(e){}beamSnd=null;}}
};
const muteBtn=document.getElementById('mute');
muteBtn.addEventListener('click',e=>{e.stopPropagation();ensureAudio();muted=!muted;muteBtn.textContent=muted?'SND OFF':'SND ON';if(muted)sfx.beamOff();});

/* ---------- input: keyboard (incl. iPad Magic Keyboard) + touch ---------- */
const keys={l:false,r:false,f:false,padL:false,padR:false,padF:false};
/* game controllers (e.g. PS5 DualSense) via the standard Gamepad API: left stick or D-pad moves,
   Cross / Square / R1 / R2 fire, Options pauses or starts */
const padPrev={f:false,p:false};
function pollPad(){
  let gps=[];try{gps=navigator.getGamepads?navigator.getGamepads():[];}catch(e){return;}
  let l=false,r=false,f=false,pz=false;
  for(const g of gps){if(!g||!g.connected)continue;const b=i=>!!(g.buttons[i]&&g.buttons[i].pressed),ax=g.axes[0]||0;
    l=l||ax<-.35||b(14);r=r||ax>.35||b(15);f=f||b(0)||b(2)||b(5)||b(7);pz=pz||b(9);}
  keys.padL=l;keys.padR=r;keys.padF=f;
  if(f&&!padPrev.f){firePressed=true;ensureAudio();}
  if(pz&&!padPrev.p){if(state==='play')pausePressed=true;else firePressed=true;}
  if(l||r||f||pz)usingKeys=true;
  padPrev.f=f;padPrev.p=pz;
}
const goL=()=>keys.l||keys.padL,goR=()=>keys.r||keys.padR,holdF=()=>keys.f||keys.padF;let usingKeys=false,firePressed=false,pausePressed=false;
const KEYMAP={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',Space:'f',ArrowUp:'f',KeyW:'f',Enter:'f',NumpadEnter:'f',KeyZ:'f',KeyX:'f',KeyP:'p',Escape:'p'};
function keyOf(e){if(KEYMAP[e.code])return KEYMAP[e.code];const k=e.key;
  if(k==='ArrowLeft'||k==='Left'||k==='a'||k==='A')return'l';if(k==='ArrowRight'||k==='Right'||k==='d'||k==='D')return'r';
  if(k===' '||k==='Spacebar'||k==='ArrowUp'||k==='Up'||k==='w'||k==='W'||k==='Enter'||k==='z'||k==='Z'||k==='x'||k==='X')return'f';
  if(k==='p'||k==='P'||k==='Escape')return'p';return null;}
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const m=keyOf(e);if(!m)return;e.preventDefault();ensureAudio();usingKeys=true;
  if(m==='p'){if(!e.repeat)pausePressed=true;return;}if(m==='f'&&!keys.f)firePressed=true;keys[m]=true;},true);
document.addEventListener('keyup',e=>{const m=keyOf(e);if(m&&m!=='p'){keys[m]=false;e.preventDefault();}},true);
addEventListener('blur',()=>{keys.l=keys.r=keys.f=false;});
const grabFocus=()=>{try{cv.focus({preventScroll:true});}catch(e){}};
document.addEventListener('pointerdown',grabFocus,true);grabFocus();
cv.addEventListener('pointerdown',()=>{ensureAudio();});

/* ---------- layout ---------- */
const scan=document.getElementById('scan');
/* touch buttons only on phones: a touchscreen whose shorter screen side is under 500 px (iPads and computers are larger) */
const isPhone=matchMedia('(pointer:coarse)').matches&&Math.min(screen.width,screen.height)<500;
if(isPhone){document.getElementById('pad').style.display='flex';
  const bind=(id,key)=>{const b=document.getElementById(id);
    const on=e=>{e.preventDefault();unlockAudio();if(key==='f'&&!keys.f)firePressed=true;keys[key]=true;b.classList.add('on');try{b.setPointerCapture(e.pointerId);}catch(_){}};
    const off=()=>{keys[key]=false;b.classList.remove('on');};
    b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointercancel',off);b.addEventListener('lostpointercapture',off);};
  bind('fire','f');
  /* ◀ ▶ act as one slide pad: the finger can roll/slide between them without lifting; direction = which side of the gap it's on */
  const dpad=document.getElementById('dpad'),bl=document.getElementById('bl'),br=document.getElementById('br');let padId=null;
  const steer=x=>{const a=bl.getBoundingClientRect(),c=br.getBoundingClientRect(),mid=(a.right+c.left)/2,left=x<mid;
    keys.l=left;keys.r=!left;bl.classList.toggle('on',left);br.classList.toggle('on',!left);};
  const release=e=>{if(e&&e.pointerId!==padId)return;padId=null;keys.l=keys.r=false;bl.classList.remove('on');br.classList.remove('on');};
  dpad.addEventListener('pointerdown',e=>{e.preventDefault();unlockAudio();padId=e.pointerId;try{dpad.setPointerCapture(e.pointerId);}catch(_){}steer(e.clientX);});
  dpad.addEventListener('pointermove',e=>{if(e.pointerId===padId){e.preventDefault();steer(e.clientX);}});
  ['pointerup','pointercancel','lostpointercapture'].forEach(t=>dpad.addEventListener(t,release));
  cv.addEventListener('pointerdown',()=>{if(state!=='play')firePressed=true;});}
function fit(){const cs=getComputedStyle(document.getElementById('wrap')),pv=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom),ph=parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight);

function killEnemy(e){

  else pts=T.dive;
  if(e.type==='turncoat'&&e.state!=='form')popup(pts,e.x-12,e.y-3,'#ffd23c');
  if(e.leader&&!e.leader.dead)e.leader.escKilled=(e.leader.escKilled||0)+1;
  addScore(pts);
  burst(e.x,e.y,e.type==='boss'?PAL.boss2:e.type==='turncoat'?PAL.captive:PAL[e.type],16,1.6);sfx.boom();

  if(e.captive){
    if(e.state==='form'){ // captor shot in formation: the fighter makes one diving run, flies off, and returns next stage with another boss

function hitEnemy(e){if(e.type==='boss'&&e.hp>1){e.hp--;sfx.bossHit();return;}killEnemy(e);}

/* ---------- player ---------- */
function shipRects(){if(!player||player.state!=='alive')return[];const r=[{x:player.x,i:0}];if(player.dual)r.push({x:player.x+15,i:1});return r;}
function hitShip(i){if(challenge)return; // invulnerable during challenging stages

  if(player.dual){const sx=i===1?player.x+15:player.x;burst(sx+7,PY+6,PAL.ship,22,1.6);sfx.small();if(i===0)player.x+=15;player.dual=false;return;}
  player.state='dead';player.deadT=0;lives--;burst(player.x+7,PY+6,['#ffffff','#ff4d4d','#ffd23c','#4aa8ff'],40,2.2);sfx.die();sfx.beamOff();
}
function noThreat(){return!enemies.some(e=>!e.dead&&(e.state==='dive'||e.state==='beam'||(e.captive&&e.state!=='form')))&&ebullets.length===0;}
function tryFire(p){
  if(gameStartIntro&&phaseT<180)return;
  const want=firePressed||(holdF()&&frame-lastShot>=12);
  if(want&&bullets.length<(p.dual?4:2)){const y=Math.round(p.py)-2;bullets.push({x:p.x+7,y});if(p.dual)bullets.push({x:p.x+22,y});shots++;lastShot=frame;sfx.shoot();}
}
function updPlayer(){
  const p=player;
  if(p.state==='alive'){
    const sp=1.75;
    if(goL()&&!goR())p.x-=sp;if(goR()&&!goL())p.x+=sp;
    p.x=clamp(p.x,8,W-8-(p.dual?30:15));
    p.py=PY;tryFire(p);
  }else if(p.state==='captured'){ // still able to shoot: destroying the capturing boss frees the ship
    tryFire(p);
    const e=p.capBy;p.x+=clamp(e.x-7-p.x,-.8,.8);p.py-=.7;p.spin+=.25;
    if(p.py<=e.y+10){e.captive=true;p.state='gone';p.deadT=0;p.capBy=null;lives--;e.beamT=230;msg={t:'FIGHTER CAPTURED',t2:'',life:160};}
  }else if(p.state==='released'){ // freed from the beam: drop back to the ship row
    tryFire(p);p.spin=0;p.py=Math.min(PY,p.py+2.2);if(p.py>=PY)p.state='alive';
  }else{
    p.deadT++;if(p.state==='dead'&&p.deadT>70)p.state='gone';
    if(p.state==='gone'){
      if(lives<=0){if(p.deadT>160&&!enemies.some(e=>!e.dead&&e.state==='beam'))gameOver();}
      else if(p.deadT>130&&(noThreat()||p.deadT>600)&&phase!=='clear'&&phase!=='chResult'){
        Object.assign(p,{state:'alive',x:104,py:PY,dual:false,spin:0});msg={t:'READY',t2:'',life:90};}
    }
  }
  firePressed=false;
}

/* ---------- main update ---------- */
function update(){
  pollPad();
  frame++;
  if(pausePressed){pausePressed=false;if(state==='play'){paused=!paused;if(paused)sfx.beamOff();}}
  const sTarget=state==='play'&&player&&player.state!=='alive'?.15:1;starSpeed+=(sTarget-starSpeed)*.05;
  if(!paused)for(const s of stars){s.y+=s.s*starSpeed;if(s.y>H){s.y=0;s.x=rnd()*W;}}
  if(paused){firePressed=false;return;}
  if(state==='title'){if(firePressed){firePressed=false;newGame();}return;}
  if(state==='over'){overT++;if(firePressed&&overT>90)state='title';firePressed=false;if(overT>900)state='title';updFx();return;}

  updFx();
  formT++;phaseT++;
  const allIn=phase==='run'&&!challenge&&!enemies.some(e=>!e.dead&&e.entering);
  if(allIn){swayAmp=Math.max(0,swayAmp-.01);breathAmp=Math.min(1,breathAmp+.01);}

  if(phase==='intro'){if(phaseT>(gameStartIntro?300:150)){phase='run';phaseT=0;gameStartIntro=false;}}
  else if(phase==='run')stageClock++;

  updPlayer();

  // player bullets
  for(let i=bullets.length-1;i>=0;i--){const b=bullets[i];let hit=false;
    for(let s=0;s<2&&!hit;s++){b.y-=3;
      for(const e of enemies){if(e.dead||e.state==='wait')continue;const T=TYPES[e.type];
        if(Math.abs(b.x-e.x)<=T.hw&&b.y<=e.y+T.hh&&b.y+5>=e.y-T.hh){hitEnemy(e);hit=true;break;}
        if(e.captive&&Math.abs(b.x-e.x)<=6&&b.y<=e.y-9&&b.y+5>=e.y-21){e.captive=false;burst(e.x,e.y-15,PAL.captive,20,1.6);sfx.small();{const pts=e.state==='form'?500:1000;addScore(pts);hits++;if(pts>500)popup(pts,e.x-12,e.y-18,'#ffd23c');}hit=true;break;}}}
    if(hit||b.y<-8)bullets.splice(i,1);}

  for(const e of enemies)if(!e.dead)updEnemy(e);

  // body collisions
  for(const r of shipRects())for(const e of enemies){if(e.dead||e.state==='wait'||e.state==='form'||e.state==='path'||e.entering)continue; /* arriving squadrons never ram you */ const T=TYPES[e.type];
    if(Math.abs(e.x-(r.x+7))<T.hw+5&&Math.abs(e.y-(PY+6))<T.hh+4){killEnemy(e);hitShip(r.i);break;}}

  // enemy bullets
  for(let i=ebullets.length-1;i>=0;i--){const b=ebullets[i];b.x+=b.vx;b.y+=b.vy;let gone=b.y>H+4;
    if(!gone)for(const r of shipRects())if(b.x>=r.x+3&&b.x<=r.x+12&&b.y+4>=PY+2&&b.y<=PY+12){hitShip(r.i);gone=true;break;}
    if(gone)ebullets.splice(i,1);}

  // rescued fighter docking
  if(rescue){const R=rescue;R.spin+=.3;
    const docking=player.state==='alive',tx=docking?Math.min(player.x,W-8-30)+22:112,ty=docking?PY+6:PY-40;
    const dx=tx-R.x,dy=ty-R.y,d=Math.hypot(dx,dy);
    if(docking&&d<2){player.x=Math.min(player.x,W-8-30);player.dual=true;rescue=null;sfx.rescue();msg={t:'TWIN FIGHTER',t2:'',life:90};}
    else if(d>.5){const s=Math.min(1.6,d);R.x+=dx/d*s;R.y+=dy/d*s;}}

  // attack scheduler
  if(allIn&&player.state==='alive'){
    if(--attackT<=0){const L=live(),forms=L.filter(e=>e.state==='form'),busy=L.filter(e=>e.busy).length,few=L.length<=6;
      const maxD=few?L.length:Math.min(2+(stage>>1),6);attackT=few?25:Math.max(45,110-stage*6)+rnd()*30;
      if(busy<maxD&&forms.length)launchAttack(forms);}}

  // stage end
  if(challenge&&phase==='run'&&chGroup<4&&enemies.every(e=>e.g!==chGroup||e.dead)){ // next wave only once this one is gone, after 0.5 s
    if(chWait<0)chWait=30;else if(--chWait<=0){chGroup++;chWait=-1;for(const e of enemies)if(e.g===chGroup)e.launchAt=stageClock+e.launchOff;}}
  if(phase==='run'&&enemies.every(e=>e.dead)&&!rescue&&player.state!=='captured'){phase=challenge?'chResult':'clear';phaseT=0;}
  if(phase==='clear'&&phaseT>60){stage++;startStage();}
  if(phase==='chResult'){if(phaseT===90){const bonus=chHits===chTotal?10000:chHits*100;addScore(bonus);if(chHits===chTotal)sfx.perfect();}
    if(chHits===chTotal&&phaseT>=90&&phaseT<300&&phaseT%14===0)burst(30+rnd()*164,60+rnd()*80,[pick(SC),pick(SC),'#ffffff'],30,2.4);if(phaseT>(chHits===chTotal?330:260)){stage++;startStage();}}
}
function launchAttack(forms){
  const bosses=forms.filter(e=>e.type==='boss');
  if(bosses.length&&rnd()<.32){const b=pick(bosses);
    const canBeam=!b.captive&&!anyCaptive()&&!player.dual&&!enemies.some(e=>!e.dead&&(e.state==='beam'||e.beamDive))&&rnd()<.5;
    startDive(b);
    if(canBeam){b.beamDive=true;b.beamX=clamp(player.x+7,24,W-24);return;}
    b.escorts=[];b.escKilled=0;
    forms.filter(w=>w.type==='wasp'&&w.r===1&&Math.abs(w.c-b.c)<=1).slice(0,2).forEach(w=>{startDive(w,true);w.leader=b;w.offX=w.x-b.x;w.offY=w.y-b.y;b.escorts.push(w);});
    return;}
  const pool=forms.filter(e=>e.type!=='boss');startDive(pool.length?pick(pool):pick(bosses));
}
function updFx(){
  for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.x+=q.vx;q.y+=q.vy;q.vx*=.97;q.vy*=.97;if(--q.life<=0)parts.splice(i,1);}
  for(let i=popups.length-1;i>=0;i--)if(--popups[i].life<=0)popups.splice(i,1);
  if(msg&&--msg.life<=0)msg=null;
}

/* ---------- rendering ---------- */
const IX=o=>(o.ox===undefined||Math.abs(o.x-o.ox)>40)?o.x:o.ox+(o.x-o.ox)*ALPHA;
const IY=o=>(o.oy===undefined||Math.abs(o.y-o.oy)>40)?o.y:o.oy+(o.y-o.oy)*ALPHA;
const IPY=p=>(p.oy===undefined||Math.abs(p.py-p.oy)>40)?p.py:p.oy+(p.py-p.oy)*ALPHA;
function drawStars(){for(const s of stars){if(((frame+s.ph)>>4)%3===0)continue;ctx.fillStyle=s.c;ctx.fillRect(s.x|0,SNAP(IY(s)),1,1);}}
function drawBeam(e){const t=e.beamT,ext=t<50?t/50:t<230?1:Math.max(0,(270-t)/40),y0=Math.round(e.y)+7,L=Math.floor((PY+14-y0)*ext),cols=['#5ad8ff','#b66cff','#ffffff'];
  for(let yy=0;yy<L;yy++){if((yy>>1)&1)continue;const hw=Math.floor(4+yy*.24);ctx.fillStyle=cols[((yy+frame*2)>>3)%3];ctx.globalAlpha=.8;ctx.fillRect(Math.round(e.x)-hw,y0+yy,hw*2,1);}ctx.globalAlpha=1;}
function drawShip(x,y,pal,spin){drawRot(SP.ship,pal,x+7,y+6,-PI/2+(spin||0));}
function hud(){
  text('SCORE',8,3,'#ff4d4d');text(score,8,12,'#f2f2ff');
  ctext('HIGH SCORE',3,'#ff4d4d');ctext(hi,12,'#f2f2ff');
}
function drawPlay(){
  for(const e of enemies)if(!e.dead&&e.state==='beam')drawBeam(e);
  const fl=(formT>>4)&1;
  for(const e of enemies){if(e.dead||e.state==='wait')continue;
    const sp=e.type==='turncoat'?SP.ship:SP[e.type][e.state==='form'?fl:(frame>>3)&1];
    const pal=e.type==='turncoat'?PAL.captive:e.type==='boss'&&e.hp<2&&!challenge?PAL.boss2:PAL[e.type];
    const ex=IX(e),ey=IY(e);drawRot(sp,pal,ex,ey,e.ang);
    if(e.captive)drawRot(SP.ship,PAL.captive,ex,ey-15,e.ang);}
  if(rescue)drawRot(SP.ship,PAL.ship,IX(rescue),IY(rescue),-PI/2+rescue.spin);
  ctx.fillStyle='#7ab8ff';for(const b of bullets){const bx=b.x|0,by=SNAP(IY(b));ctx.fillRect(bx,by,1,6);ctx.fillStyle='#f2f2ff';ctx.fillRect(bx,by,1,2);ctx.fillStyle='#7ab8ff';}
  for(const b of ebullets){ctx.fillStyle=(frame>>2)&1?'#ff6a8a':'#ffd23c';ctx.fillRect(SNAP(IX(b))-1,SNAP(IY(b)),2,5);}
  const p=player;
  if(p.state==='alive'&&!(gameStartIntro&&phaseT<180)){const px=IX(p);drawShip(px,PY,PAL.ship);if(p.dual)drawShip(px+15,PY,PAL.ship);}
  else if(p.state==='captured'||p.state==='released')drawShip(IX(p),IPY(p),PAL.ship,p.spin);
  for(const q of parts){ctx.fillStyle=q.c;const s=q.life>22?2:1;ctx.fillRect(SNAP(IX(q)),SNAP(IY(q)),s,s);}
  for(const u of popups)text(u.t,u.x|0,u.y|0,u.c);
  hud();
  const reserve=Math.max(0,lives-(p.state==='alive'||p.state==='captured'||p.state==='released'?1:0));
  for(let i=0;i<Math.min(reserve,6);i++)drawShip(4+i*16,H-15,PAL.ship);
  drawBadges(stage+1);
  if(phase==='intro'){if(gameStartIntro&&phaseT<180)ctext('PLAYER 1',140,'#7ab8ff');else if(challenge)ctext('CHALLENGING STAGE',140,'#7ab8ff');else ctext('STAGE '+(stage+1),140,'#7ab8ff');}
  if(phase==='chResult'){ctext('NUMBER OF HITS  '+chHits,130,'#7ab8ff');
    if(phaseT>=90){if(chHits===chTotal){const fc=['#ffd23c','#ff6a8a','#7ab8ff','#3cf0a0','#f2f2ff'][(frame>>3)%5];ctext('PERFECT!',148,fc);ctext('SPECIAL BONUS 10000',164,'#ffd23c');}else ctext('BONUS  '+chHits*100,148,'#ffd23c');}}
  if(msg)ctext(msg.t,150,msg.t==='FIGHTER CAPTURED'||msg.t==='YOUR FIGHTER TURNED'?'#ff4d4d':'#7ab8ff');
  if(paused)ctext('PAUSED',170,'#f2f2ff');
}
function drawTitle(){
  hud();
  ctext('ORBITAL SIEGE',44,'#7ab8ff');ctext('- SWARM -',56,'#ff6a8a');
  const f=(frame>>4)&1,rows=[['boss','150 / 400+'],['wasp',' 80 / 160'],['drone',' 50 / 100']];
  text('IN FORMATION / DIVING',48,84,'#6a7a99');
  rows.forEach(([k,s],i)=>{const y=104+i*20;drawRot(SP[k][f],PAL[k],70,y+3,-PI/2);text(s,88,y,'#f2f2ff');});
  drawRot(SP.ship,PAL.captive,70,170,-PI/2);text('RESCUE A CAPTURED',88,163,'#f2f2ff');text('SHIP FOR TWIN FIRE',88,173,'#f2f2ff');
  if((frame>>5)&1)ctext(isPhone?'TAP FIRE TO START':'PRESS SPACE TO START',204,'#ffd23c');
  ctext('ARROWS OR A/D MOVE',220,'#6a7a99');ctext('SPACE FIRES   P PAUSES',230,'#6a7a99');ctext('CONTROLLER: STICK + X',240,'#6a7a99');
  if(!usingKeys&&!isPhone)ctext('IPAD: TAP SCREEN FIRST',254,'#6a7a99');
}
function drawOver(){
  hud();ctext('GAME OVER',96,'#ff4d4d');
  ctext('- RESULTS -',124,'#7ab8ff');
  text('SHOTS FIRED',40,144,'#ffd23c');rtext(shots,184,144,'#ffd23c');
  text('NUMBER OF HITS',40,158,'#ffd23c');rtext(hits,184,158,'#ffd23c');
  const ratio=shots?(hits/shots*100).toFixed(1):'0.0';text('HIT-MISS RATIO',40,172,'#f2f2ff');rtext(ratio+'%',184,172,'#f2f2ff');
  if(overT>90&&(frame>>5)&1)ctext(isPhone?'TAP FIRE':'PRESS SPACE',210,'#6a7a99');
}
function render(){
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);drawStars();
  if(state==='title')drawTitle();else if(state==='over')drawOver();else drawPlay();
}

/* ---------- fixed 60 Hz loop ---------- */
let last=performance.now(),acc=0;const STEP=1000/60;
function snap(){const k=o=>{o.ox=o.x;o.oy=o.y;};if(player){player.ox=player.x;player.oy=player.py;}
  enemies.forEach(k);bullets.forEach(k);ebullets.forEach(k);parts.forEach(k);stars.forEach(k);if(rescue)k(rescue);}
function loop(t){acc+=Math.min(t-last,100);last=t;while(acc>=STEP){snap();update();acc-=STEP;}ALPHA=paused?1:acc/STEP;render();requestAnimationFrame(loop);}
document.addEventListener('visibilitychange',()=>{if(document.hidden){if(state==='play')paused=true;sfx.beamOff();if(silentEl)try{silentEl.pause();}catch(e){}}else last=performance.now();});
requestAnimationFrame(loop);
})();
</script>
</body>
